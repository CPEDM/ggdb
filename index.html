<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="견과다방">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090B10">
  <link rel="manifest" href="manifest.json">
  <title>견과다방 매장 안내판</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'NanumGothic', sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ===== 테마 스타일 (주간 라이트 / 야간 다크 / 심야 블랙아웃) ===== */
    body.theme-light {
      background-color: #F7F3EC;
      background-image: -webkit-radial-gradient(circle at 20% 15%, #FFFDF9 0%, #EFE8DC 100%);
      background-image: radial-gradient(circle at 20% 15%, #FFFDF9 0%, #EFE8DC 100%);
      color: #1C1917;
    }

    body.theme-dark {
      background-color: #090B10;
      background-image: -webkit-radial-gradient(circle at 50% 20%, #151B28 0%, #07090D 100%);
      background-image: radial-gradient(circle at 50% 20%, #151B28 0%, #07090D 100%);
      color: #F8FAFC;
    }

    body.theme-blackout {
      background-color: #000000;
      background-image: none;
      color: #E2E8F0;
    }

    body.theme-blackout .app-shell {
      opacity: 0.16;
    }

    /* ===== 전체 레이아웃 ===== */
    .app-shell {
      width: 100%;
      height: 100%;
      padding: 1.25rem 2.1rem 1.35rem;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-transition: opacity 0.8s ease;
      transition: opacity 0.8s ease;
    }

    /* ===== 픽셀 시프트 전용 래퍼 (내부 애니메이션과 transform 충돌 방지) ===== */
    .shift-layer {
      width: 100%;
      height: 100%;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }

    .shift-layer.pixel-shift-on {
      -webkit-animation: pixelShift 240s linear infinite;
      animation: pixelShift 240s linear infinite;
    }

    /* ===== 상단 헤더 (슬림 매장명 + 전체화면/연결 버튼) ===== */
    .top-bar {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid rgba(120, 113, 108, 0.2);
    }

    body.theme-dark .top-bar {
      border-bottom-color: rgba(148, 163, 184, 0.16);
    }

    .brand-box {
      max-width: 72%;
      cursor: pointer;
    }

    .brand-name {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.12;
    }

    .brand-sub {
      margin-top: 0.18rem;
      font-size: 0.88rem;
      font-weight: 500;
      opacity: 0.74;
    }

    .header-actions {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      gap: 0.5rem;
    }

    .hdr-btn {
      border: 1px solid rgba(120, 113, 108, 0.35);
      background-color: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 0.38rem 0.78rem;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0.78;
      -webkit-transition: opacity 0.2s ease, background-color 0.2s ease;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .hdr-btn:active {
      opacity: 1;
    }

    .hdr-btn.warn-btn {
      border-color: #D97706;
      color: #D97706;
      opacity: 1;
    }

    body.theme-dark .hdr-btn {
      border-color: rgba(148, 163, 184, 0.35);
    }

    body.theme-dark .hdr-btn.warn-btn {
      border-color: #FBBF24;
      color: #FBBF24;
    }

    /* ===== 중앙 메인 상태 카드 ===== */
    .hero-wrap {
      -webkit-box-flex: 1;
      -webkit-flex: 1 1 auto;
      flex: 1 1 auto;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 0.55rem 0;
    }

    .status-card {
      width: 100%;
      max-width: 68rem;
      border-radius: 1.65rem;
      padding: 1.75rem 2.35rem 1.9rem;
      text-align: center;
      border: 2px solid transparent;
      -webkit-transition: background-color 0.4s ease, border-color 0.4s ease;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    body.theme-light .status-card {
      background-color: rgba(255, 255, 255, 0.94);
      border-color: rgba(28, 25, 23, 0.1);
      box-shadow: 0 12px 32px rgba(28, 25, 23, 0.08);
    }

    body.theme-dark .status-card {
      background-color: rgba(18, 24, 36, 0.92);
      border-color: rgba(148, 163, 184, 0.18);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    body.theme-blackout .status-card {
      background-color: #000000;
      border-color: #1E293B;
      box-shadow: none;
    }

    /* 상태 카드 상단 메타 줄: [상태 영문 배지] <-> [현재 날짜 · 시간] */
    .status-meta-row {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1.05rem;
    }

    .status-meta-row.center-only {
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
    }

    .status-pill {
      display: inline-block;
      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    .anim-on .status-dot {
      -webkit-animation: dotPulse 1.8s ease-in-out infinite;
      animation: dotPulse 1.8s ease-in-out infinite;
    }

    /* 상태 카드 안으로 이동한 날짜 & 시간 표시 영역 */
    .clock-inline {
      display: -webkit-inline-box;
      display: -webkit-inline-flex;
      display: inline-flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 0.42rem 1.05rem;
      border-radius: 999px;
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    body.theme-light .clock-inline {
      background-color: #F3EFE6;
      color: #292524;
    }

    body.theme-dark .clock-inline {
      background-color: rgba(30, 41, 59, 0.85);
      color: #E2E8F0;
    }

    body.theme-blackout .clock-inline {
      background-color: #090B10;
      color: #94A3B8;
    }

    .sync-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      margin-right: 0.48rem;
      vertical-align: middle;
      background-color: #10B981;
    }

    .sync-dot.offline {
      background-color: #F59E0B;
    }

    .clock-date-text {
      margin-right: 0.55rem;
      opacity: 0.86;
    }

    .clock-time-text {
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .clock-colon {
      display: inline-block;
    }

    .clock-colon.blink {
      -webkit-animation: colonBlink 1s steps(2, start) infinite;
      animation: colonBlink 1s steps(2, start) infinite;
    }

    /* 대폭 상향 조정된 메인 상태 문구 */
    .status-main {
      font-size: 7.4rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.08;
      margin: 0.25rem 0 0.85rem;
      word-break: keep-all;
    }

    .status-main.status-main-long {
      font-size: 5.9rem;
    }

    .status-entering {
      -webkit-animation: fadeSlideIn 0.55s ease-out;
      animation: fadeSlideIn 0.55s ease-out;
    }

    .anim-on.anim-status-pulse .status-main {
      -webkit-animation: statusBreath 3.4s ease-in-out infinite;
      animation: statusBreath 3.4s ease-in-out infinite;
    }

    .anim-on.anim-status-fade .status-main {
      -webkit-animation: statusSoftFade 4s ease-in-out infinite;
      animation: statusSoftFade 4s ease-in-out infinite;
    }

    .status-sub {
      font-size: 1.52rem;
      font-weight: 600;
      line-height: 1.38;
      opacity: 0.92;
      word-break: keep-all;
      margin-bottom: 1.25rem;
    }

    /* 영업시간 요약 바 */
    .hours-strip {
      display: inline-block;
      padding: 0.62rem 1.35rem;
      border-radius: 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.5;
    }

    body.theme-light .hours-strip {
      background-color: #F3EFE6;
      color: #44403C;
    }

    body.theme-dark .hours-strip {
      background-color: rgba(30, 41, 59, 0.72);
      color: #CBD5E1;
    }

    .hours-sep {
      margin: 0 0.65rem;
      opacity: 0.45;
    }

    /* 상태별 색상 매핑 (라이트) */
    body.theme-light.st-open .status-pill { background-color: #DCFCE7; color: #065F46; }
    body.theme-light.st-open .status-dot { background-color: #059669; }
    body.theme-light.st-open .status-main { color: #047857; }
    body.theme-light.st-open .status-card { border-color: rgba(5, 150, 105, 0.35); }

    body.theme-light.st-lastorder .status-pill { background-color: #FEF3C7; color: #92400E; }
    body.theme-light.st-lastorder .status-dot { background-color: #D97706; }
    body.theme-light.st-lastorder .status-main { color: #B45309; }
    body.theme-light.st-lastorder .status-card { border-color: rgba(217, 119, 6, 0.4); }

    body.theme-light.st-break .status-pill { background-color: #DBEAFE; color: #1E40AF; }
    body.theme-light.st-break .status-dot { background-color: #2563EB; }
    body.theme-light.st-break .status-main { color: #1D4ED8; }
    body.theme-light.st-break .status-card { border-color: rgba(37, 99, 235, 0.35); }

    body.theme-light.st-soldout .status-pill { background-color: #FEE2E2; color: #991B1B; }
    body.theme-light.st-soldout .status-dot { background-color: #DC2626; }
    body.theme-light.st-soldout .status-main { color: #B91C1C; }
    body.theme-light.st-soldout .status-card { border-color: rgba(220, 38, 38, 0.4); }

    body.theme-light.st-holiday .status-pill { background-color: #F3E8FF; color: #6B21A8; }
    body.theme-light.st-holiday .status-dot { background-color: #9333EA; }
    body.theme-light.st-holiday .status-main { color: #7E22CE; }
    body.theme-light.st-holiday .status-card { border-color: rgba(147, 51, 234, 0.35); }

    body.theme-light.st-preopen .status-pill { background-color: #FEF3C7; color: #78350F; }
    body.theme-light.st-preopen .status-dot { background-color: #D97706; }
    body.theme-light.st-preopen .status-main { color: #92400E; }

    body.theme-light.st-closed .status-pill { background-color: #E7E5E4; color: #44403C; }
    body.theme-light.st-closed .status-dot { background-color: #78716C; }
    body.theme-light.st-closed .status-main { color: #57534E; }

    /* 상태별 색상 매핑 (다크) */
    body.theme-dark.st-open .status-pill { background-color: rgba(16, 185, 129, 0.18); color: #6EE7B7; }
    body.theme-dark.st-open .status-dot { background-color: #34D399; }
    body.theme-dark.st-open .status-main { color: #34D399; }
    body.theme-dark.st-open .status-card { border-color: rgba(52, 211, 153, 0.38); }

    body.theme-dark.st-lastorder .status-pill { background-color: rgba(245, 158, 11, 0.2); color: #FCD34D; }
    body.theme-dark.st-lastorder .status-dot { background-color: #FBBF24; }
    body.theme-dark.st-lastorder .status-main { color: #FBBF24; }
    body.theme-dark.st-lastorder .status-card { border-color: rgba(251, 191, 36, 0.38); }

    body.theme-dark.st-break .status-pill { background-color: rgba(59, 130, 246, 0.2); color: #93C5FD; }
    body.theme-dark.st-break .status-dot { background-color: #60A5FA; }
    body.theme-dark.st-break .status-main { color: #60A5FA; }
    body.theme-dark.st-break .status-card { border-color: rgba(96, 165, 250, 0.38); }

    body.theme-dark.st-soldout .status-pill { background-color: rgba(239, 68, 68, 0.2); color: #FCA5A5; }
    body.theme-dark.st-soldout .status-dot { background-color: #F87171; }
    body.theme-dark.st-soldout .status-main { color: #F87171; }
    body.theme-dark.st-soldout .status-card { border-color: rgba(248, 113, 113, 0.42); }

    body.theme-dark.st-holiday .status-pill { background-color: rgba(168, 85, 247, 0.22); color: #D8B4FE; }
    body.theme-dark.st-holiday .status-dot { background-color: #C084FC; }
    body.theme-dark.st-holiday .status-main { color: #C084FC; }
    body.theme-dark.st-holiday .status-card { border-color: rgba(192, 132, 252, 0.38); }

    body.theme-dark.st-preopen .status-pill { background-color: rgba(245, 158, 11, 0.18); color: #FDE68A; }
    body.theme-dark.st-preopen .status-dot { background-color: #FBBF24; }
    body.theme-dark.st-preopen .status-main { color: #FDE68A; }

    body.theme-dark.st-closed .status-pill { background-color: rgba(148, 163, 184, 0.16); color: #CBD5E1; }
    body.theme-dark.st-closed .status-dot { background-color: #94A3B8; }
    body.theme-dark.st-closed .status-main { color: #94A3B8; }

    /* ===== 하단 공지 & QR 영역 ===== */
    .bottom-bar {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      gap: 1.2rem;
    }

    .notice-box {
      -webkit-box-flex: 1;
      -webkit-flex: 1 1 auto;
      flex: 1 1 auto;
      min-width: 0;
      border-radius: 1rem;
      padding: 0.85rem 1.3rem;
      overflow: hidden;
    }

    body.theme-light .notice-box {
      background-color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(28, 25, 23, 0.1);
    }

    body.theme-dark .notice-box {
      background-color: rgba(18, 24, 36, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .notice-label {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.16rem 0.55rem;
      border-radius: 0.4rem;
      margin-bottom: 0.32rem;
      background-color: rgba(217, 119, 6, 0.16);
      color: #B45309;
    }

    body.theme-dark .notice-label {
      background-color: rgba(251, 191, 36, 0.18);
      color: #FCD34D;
    }

    .notice-viewport {
      width: 100%;
      overflow: hidden;
      position: relative;
      min-height: 1.85rem;
    }

    .notice-text {
      font-size: 1.32rem;
      font-weight: 700;
      line-height: 1.42;
      -webkit-transition: opacity 0.38s ease, -webkit-transform 0.38s ease;
      transition: opacity 0.38s ease, transform 0.38s ease;
    }

    /* 티커(마퀴) 모드 */
    .notice-text.mode-ticker {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
    }

    .anim-on .notice-text.mode-ticker {
      -webkit-animation: marqueeScroll 18s linear infinite;
      animation: marqueeScroll 18s linear infinite;
    }

    /* 교차 페이드 모드 */
    .notice-text.mode-fade {
      white-space: pre-line;
      text-align: left;
    }

    .notice-text.mode-fade.is-fading-out {
      opacity: 0;
      -webkit-transform: translate3d(0, 6px, 0);
      transform: translate3d(0, 6px, 0);
    }

    .anim-on .notice-text.mode-fade-single {
      -webkit-animation: statusSoftFade 4.2s ease-in-out infinite;
      animation: statusSoftFade 4.2s ease-in-out infinite;
    }

    /* 부드러운 부유 모드 */
    .notice-text.mode-float {
      white-space: pre-line;
    }

    .anim-on .notice-text.mode-float {
      -webkit-animation: gentleFloat 3.6s ease-in-out infinite;
      animation: gentleFloat 3.6s ease-in-out infinite;
    }

    /* 정적 모드 */
    .notice-text.mode-none {
      white-space: pre-line;
    }

    /* QR 카드 */
    .qr-box {
      -webkit-box-flex: 0;
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      padding: 0.65rem 0.9rem;
      border-radius: 1rem;
    }

    body.theme-light .qr-box {
      background-color: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(28, 25, 23, 0.12);
    }

    body.theme-dark .qr-box {
      background-color: rgba(18, 24, 36, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .qr-img-wrap {
      width: 4.5rem;
      height: 4.5rem;
      background-color: #FFFFFF;
      border-radius: 0.5rem;
      padding: 0.25rem;
      margin-right: 0.75rem;
      overflow: hidden;
    }

    .qr-img-wrap img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .qr-caption {
      font-size: 0.88rem;
      font-weight: 700;
      max-width: 7.5rem;
      line-height: 1.35;
      word-break: keep-all;
    }

    /* ===== 안내 토스트 & API URL 설정 모달 ===== */
    .toast-banner {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      -webkit-transform: translate3d(-50%, 0, 0);
      transform: translate3d(-50%, 0, 0);
      background-color: rgba(15, 23, 42, 0.92);
      color: #F8FAFC;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      z-index: 900;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.65);
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      width: 100%;
      max-width: 32rem;
      background-color: #FFFFFF;
      color: #0F172A;
      border-radius: 1rem;
      padding: 1.4rem;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .modal-desc {
      font-size: 0.86rem;
      color: #475569;
      line-height: 1.45;
      margin-bottom: 0.85rem;
    }

    .modal-input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #CBD5E1;
      border-radius: 0.5rem;
      font-size: 0.88rem;
      margin-bottom: 0.9rem;
      color: #0F172A;
      background-color: #F8FAFC;
    }

    .modal-actions {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: end;
      -webkit-justify-content: flex-end;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .modal-btn {
      padding: 0.52rem 1rem;
      border-radius: 0.5rem;

      background-color: #F1F5F9;

    .modal-btn.primary {
      background-color: #0F172A;

    }

    .hidden {
      display: none !important;
    }

    /* ===== GPU 전용 키프레임 애니메이션 (-webkit- 호환) ===== */
    @-webkit-keyframes pixelShift {
      0%   { -webkit-transform: translate3d(0px, 0px, 0); }
      25%  { -webkit-transform: translate3d(3px, 2px, 0); }
      50%  { -webkit-transform: translate3d(0px, 4px, 0); }
      75%  { -webkit-transform: translate3d(-3px, 2px, 0); }
      100% { -webkit-transform: translate3d(0px, 0px, 0); }
    }
    @keyframes pixelShift {
      0%   { transform: translate3d(0px, 0px, 0); }
      25%  { transform: translate3d(3px, 2px, 0); }
      50%  { transform: translate3d(0px, 4px, 0); }
      75%  { transform: translate3d(-3px, 2px, 0); }
      100% { transform: translate3d(0px, 0px, 0); }
    }

    @-webkit-keyframes statusBreath {
      0%, 100% { -webkit-transform: scale3d(1, 1, 1); opacity: 1; }
      50%      { -webkit-transform: scale3d(1.03, 1.03, 1); opacity: 0.88; }
    }
    @keyframes statusBreath {
      0%, 100% { transform: scale3d(1, 1, 1); opacity: 1; }
      50%      { transform: scale3d(1.03, 1.03, 1); opacity: 0.88; }
    }

    @-webkit-keyframes statusSoftFade {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.72; }
    }
    @keyframes statusSoftFade {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.72; }
    }

    @-webkit-keyframes dotPulse {
      0%, 100% { -webkit-transform: scale3d(1, 1, 1); opacity: 1; }
      50%      { -webkit-transform: scale3d(1.35, 1.35, 1); opacity: 0.55; }
    }
    @keyframes dotPulse {
      0%, 100% { transform: scale3d(1, 1, 1); opacity: 1; }
      50%      { transform: scale3d(1.35, 1.35, 1); opacity: 0.55; }
    }

    @-webkit-keyframes fadeSlideIn {
      0%   { opacity: 0; -webkit-transform: translate3d(0, 14px, 0); }
      100% { opacity: 1; -webkit-transform: translate3d(0, 0, 0); }
    }
    @keyframes fadeSlideIn {
      0%   { opacity: 0; transform: translate3d(0, 14px, 0); }
      100% { opacity: 1; transform: translate3d(0, 0, 0); }
    }

    @-webkit-keyframes marqueeScroll {
      0%   { -webkit-transform: translate3d(0, 0, 0); }
      100% { -webkit-transform: translate3d(-100%, 0, 0); }
    }
    @keyframes marqueeScroll {
      0%   { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    @-webkit-keyframes gentleFloat {
      0%, 100% { -webkit-transform: translate3d(0, 0, 0); opacity: 1; }
      50%      { -webkit-transform: translate3d(0, -3px, 0); opacity: 0.85; }
    }
    @keyframes gentleFloat {
      0%, 100% { transform: translate3d(0, 0, 0); opacity: 1; }
      50%      { transform: translate3d(0, -3px, 0); opacity: 0.85; }
    }

    @-webkit-keyframes colonBlink {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }
    @keyframes colonBlink {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }

    /* 세로형 태블릿 대응 */
    @media screen and (orientation: portrait) {
      .app-shell { padding: 1.3rem 1.2rem; }
      .status-card { padding: 1.9rem 1.25rem; }

        justify-content: center;

      .status-main { font-size: 5.4rem; }
      .status-main.status-main-long { font-size: 4.2rem; }
      .bottom-bar {
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: stretch;
        -webkit-align-items: stretch;
        align-items: stretch;
      }
      .qr-box {
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
      }
    }

<body class="theme-light st-open anim-on anim-status-pulse">
  <div class="app-shell">
    <div id="shiftLayer" class="shift-layer pixel-shift-on">

      <!-- 상단 슬림 헤더 -->
      <header class="top-bar">
        <div id="brandBox" class="brand-box" title="길게 또는 두 번 클릭하면 API 연결 설정을 열 수 있습니다">
          <div id="brandName" class="brand-name">견과다방</div>
          <div id="brandSub" class="brand-sub">매일 직접 볶는 신선한 견과류 &amp; 수제 음료</div>
        </div>
        <div class="header-actions">
          <button id="apiSetupBtn" type="button" class="hdr-btn warn-btn hidden">시트 연결</button>
          <button id="fsBtn" type="button" class="hdr-btn">전체화면</button>
        </div>
      </header>

      <!-- 중앙 상태 카드 (현재 날짜/시간 통합 + 대형 상태 문구) -->
      <main id="heroWrap" class="hero-wrap">
        <section class="status-card">
          <div id="statusMetaRow" class="status-meta-row">
            <div class="status-pill">
              <span class="status-dot"></span>
              <span id="statusEn">NOW OPEN</span>
            </div>
            <div id="clockBox" class="clock-inline">
              <span id="syncDot" class="sync-dot" title="실시간 연동 상태"></span>
              <span id="clockDate" class="clock-date-text">00월 00일 (월)</span>
              <span class="clock-time-text">
                <span id="clockHour">09</span><span class="clock-colon blink">:</span><span id="clockMin">00</span>
              </span>
            </div>
          </div>

          <div id="statusMain" class="status-main">영업중</div>
          <div id="statusSub" class="status-sub">오늘 20:00까지 영업합니다</div>
          <div id="hoursStrip" class="hours-strip">
            평일 09:00 - 20:00<span class="hours-sep">|</span>주말 10:00 - 20:00
          </div>
        </section>
      </main>

      <!-- 하단 공지 & QR -->
      <footer id="bottomBar" class="bottom-bar">
        <div id="noticeBox" class="notice-box">
          <div class="notice-label">안내</div>
          <div id="noticeViewport" class="notice-viewport">
            <div id="noticeText" class="notice-text mode-ticker">오늘 볶은 신선한 견과류가 준비되어 있습니다.</div>
          </div>
        </div>
        <div id="qrBox" class="qr-box hidden">
          <div class="qr-img-wrap">
            <img id="qrImg" alt="QR" src="">
          </div>
          <div id="qrCaption" class="qr-caption">메뉴 &amp; 매장 소식 보기</div>
        </div>
      </footer>

    </div>
  </div>

  <!-- 안내 토스트 -->
  <div id="toastBanner" class="toast-banner hidden"></div>

  <!-- 구글 Apps Script API 주소 연결 모달 (미설정 시 또는 브랜드 더블클릭 시 표시) -->
  <div id="apiModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-title">구글 시트 API 연결 설정</div>
      <div class="modal-desc">
        Google Apps Script 웹 앱 배포 후 발급된 URL(<code>https://script.google.com/macros/s/.../exec</code>)을 입력해 주세요.
        한 번 저장하면 이 태블릿 브라우저에 자동 기억됩니다.
      </div>
      <input id="apiUrlInput" class="modal-input" type="url" placeholder="https://script.google.com/macros/s/.../exec">
      <div class="modal-actions">
        <button id="apiCancelBtn" type="button" class="modal-btn">닫기</button>
        <button id="apiSaveBtn" type="button" class="modal-btn primary">저장 및 연결</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // 고정된 Google Apps Script 웹 앱 API 주소 (?api= 쿼리로 임시 재지정 가능)
      var DEFAULT_GAS_API_URL = 'https://script.google.com/macros/s/AKfycby_BNI89e4ER03u9B2JRlL5cM8y8gpPjzBetjRRfELx0828Gc_ZNW5H6NWNeX7XB9qwwQ/exec';

      var STORAGE_KEY = 'gyeongwa_display_cache_v1';
      var API_URL_STORAGE_KEY = 'gyeongwa_gas_api_url_v1';
      var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

      var FALLBACK_CONFIG = {
        version: 1,
        manualActive: false,
        manualStatus: '재료소진',
        manualAutoExpire: true,
        manualAppliedDate: '',
        holidayWeekendMode: false,

        breakEnabled: false,
        lastOrderEnabled: false,
        noticeEnabled: true,
        animEnabled: true,
        clockEnabled: true,
        nextInfoEnabled: true,
        qrEnabled: false,
        blackoutEnabled: true,
        pixelShiftEnabled: true,

        weekdayOpen: '09:00',
        weekdayLastOrder: '19:30',
        weekdayClose: '20:00',
        weekdayBreakStart: '15:00',
        weekdayBreakEnd: '16:00',

        weekendOpen: '10:00',
        weekendLastOrder: '19:30',
        weekendClose: '20:00',
        weekendBreakStart: '15:00',
        weekendBreakEnd: '16:00',

        closedDays: '없음',

        storeName: '견과다방',
        storeSubtitle: '매일 직접 볶는 신선한 견과류 & 수제 음료',
        noticeText: '오늘 볶은 신선한 견과류가 준비되어 있습니다.\n편하게 들어오셔서 구경하세요!',
        soldoutMsg: '준비된 재료가 모두 소진되어 조기 마감합니다. 감사합니다.',
        holidayMsg: '매장 사정으로 오늘 하루 쉬어갑니다. 양해 부탁드립니다.',

        themeMode: '자동(주간 라이트 / 야간 다크)',
        statusAnimation: '숨쉬기 펄스',
        noticeAnimation: '흐르는 티커(마퀴)',
        fontScale: '1.0',
        qrUrl: '',
        qrLabel: '메뉴 & 매장 소식 보기'
      };

      var currentConfig = cloneObj(FALLBACK_CONFIG);
      var gasApiUrl = '';
      var clockOffsetMs = 0;
      var lastSyncSuccessMs = 0;
      var lastRenderedStatusCode = '';
      var lastNoticeSignature = '';
      var lastQrUrl = '';
      var noticeLines = [];
      var noticeLineIndex = 0;
      var noticeFadeTimer = null;
      var pollTimer = null;
      var toastTimer = null;
      var statusEnterTimer = null;
      var pageBootMs = Date.now();
      var reloadAttempted = false;
      var lastHeroTapMs = 0;

      /* ===== 유틸리티 (ES5 호환) ===== */
      function cloneObj(obj) {
        var out = {};
        for (var k in obj) {
          if (Object.prototype.hasOwnProperty.call(obj, k)) {
            out[k] = obj[k];
          }
        }
        return out;
      }

      function mergeConfig(incoming) {
        var merged = cloneObj(FALLBACK_CONFIG);
        if (incoming && typeof incoming === 'object') {
          for (var k in merged) {
            if (Object.prototype.hasOwnProperty.call(incoming, k) && incoming[k] !== undefined && incoming[k] !== null) {
              merged[k] = incoming[k];
            }
          }
          if (incoming.serverNowMs && typeof incoming.serverNowMs === 'number' && incoming.serverNowMs > 1700000000000) {
            clockOffsetMs = incoming.serverNowMs - Date.now();
          }
        }
        return merged;
      }

      function pad2(n) {
        return (n < 10 ? '0' : '') + n;
      }

      function getNowUtcMs() {
        return Date.now() + clockOffsetMs;
      }

      function getKstDate(utcMs) {
        return new Date(utcMs + 9 * 3600 * 1000);
      }

      function parseHmToMin(hmStr, fallbackMin) {
        var m = String(hmStr || '').trim().match(/^(\d{1,2}):(\d{2})$/);
        if (!m) return fallbackMin;
        var h = parseInt(m[1], 10);
        var min = parseInt(m[2], 10);
        if (h < 0 || h > 23 || min < 0 || min > 59) return fallbackMin;
        return h * 60 + min;
      }

      function parseClosedDays(str) {
        var map = {};
        var s = String(str || '').trim();
        if (!s || s === '없음') return map;
        for (var i = 0; i < DAY_NAMES.length; i++) {
          if (s.indexOf(DAY_NAMES[i]) !== -1) {
            map[i] = true;
          }
        }
        return map;
      }

      function saveLocalValue(key, val) {
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {}
      }

      function loadLocalValue(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (e) {
          return null;
        }
      }

      function getQueryParam(name) {
        try {
          var search = window.location.search || '';
          if (!search || search.length < 2) return '';
          var pairs = search.substring(1).split('&');
          for (var i = 0; i < pairs.length; i++) {
            var kv = pairs[i].split('=');
            if (decodeURIComponent(kv[0] || '') === name) {
              return decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
            }
          }
        } catch (e) {}
        return '';
      }

      function showToast(msg, durationMs) {
        var el = document.getElementById('toastBanner');
        if (!el) return;
        el.textContent = msg;
        el.className = 'toast-banner';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          el.className = 'toast-banner hidden';
        }, durationMs || 4000);
      }

      /* ===== 전체화면 제어 ===== */
      function isInFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        );
      }

      function updateFullscreenButton() {
        var btn = document.getElementById('fsBtn');
        if (!btn) return;
        if (isInFullscreen()) {
          btn.className = 'hdr-btn hidden';
        } else {
          btn.className = 'hdr-btn';
          btn.textContent = '전체화면';
        }
      }

      function toggleFullscreen() {
        var docEl = document.documentElement;
        if (isInFullscreen()) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
          return;
        }

        var req =
          docEl.requestFullscreen ||
          docEl.webkitRequestFullscreen ||
          docEl.mozRequestFullScreen ||
          docEl.msRequestFullscreen;

        if (req) {
          try {
            var ret = req.call(docEl);
            if (ret && typeof ret.catch === 'function') {
              ret.catch(function () {
                showToast('아이패드는 Safari 공유 버튼 ➔ [홈 화면에 추가]로 실행하면 전체화면이 됩니다.', 5000);
              });
            }
          } catch (e) {
            showToast('아이패드는 Safari 공유 버튼 ➔ [홈 화면에 추가]로 실행하면 전체화면이 됩니다.', 5000);
          }
        } else {
          showToast('아이패드는 Safari 공유 버튼 ➔ [홈 화면에 추가]로 실행하면 전체화면이 됩니다.', 5000);
        }
      }

      /* ===== 핵심 영업 상태 판별 엔진 (KST 기준) ===== */
      function evaluateDisplayState(cfg, utcMs) {
        var kst = getKstDate(utcMs);
        var year = kst.getUTCFullYear();
        var month = kst.getUTCMonth() + 1;
        var dateNum = kst.getUTCDate();
        var dayIdx = kst.getUTCDay();
        var hours = kst.getUTCHours();
        var mins = kst.getUTCMinutes();
        var nowMin = hours * 60 + mins;
        var todayStr = year + '-' + pad2(month) + '-' + pad2(dateNum);

        var closedMap = parseClosedDays(cfg.closedDays);

        function getDaySchedule(dIdx, applyHolidayOverride) {
          var isWknd = (dIdx === 0 || dIdx === 6) || applyHolidayOverride;
          var openStr = isWknd ? cfg.weekendOpen : cfg.weekdayOpen;
          var closeStr = isWknd ? cfg.weekendClose : cfg.weekdayClose;
          var loStr = isWknd ? cfg.weekendLastOrder : cfg.weekdayLastOrder;
          var bStartStr = isWknd ? cfg.weekendBreakStart : cfg.weekdayBreakStart;
          var bEndStr = isWknd ? cfg.weekendBreakEnd : cfg.weekdayBreakEnd;

          var openMin = parseHmToMin(openStr, isWknd ? 600 : 540);
          var closeMin = parseHmToMin(closeStr, 1200);
          if (closeMin <= openMin) closeMin = openMin + 60;

          return {
            isWeekend: isWknd,
            openStr: openStr,
            closeStr: closeStr,
            loStr: loStr,
            bStartStr: bStartStr,
            bEndStr: bEndStr,
            openMin: openMin,
            closeMin: closeMin,
            loMin: parseHmToMin(loStr, closeMin - 30),
            bStartMin: parseHmToMin(bStartStr, 900),
            bEndMin: parseHmToMin(bEndStr, 960)
          };
        }

        function findNextOpenText(startOffset) {
          for (var offset = startOffset; offset <= 7; offset++) {
            var nextIdx = (dayIdx + offset) % 7;
            if (!closedMap[nextIdx]) {
              var sched = getDaySchedule(nextIdx, false);
              var prefix = (offset === 0) ? '오늘' : (offset === 1 ? '내일(' + DAY_NAMES[nextIdx] + ')' : DAY_NAMES[nextIdx] + '요일');
              return prefix + ' ' + sched.openStr + ' 오픈';
            }
          }
          return '';
        }

        var todaySched = getDaySchedule(dayIdx, !!cfg.holidayWeekendMode);
        var isTodayClosedDay = !!closedMap[dayIdx];

        // 1. 수동 제어 확인 (당일 자동 만료 체크 포함)
        var manualStillValid = !!cfg.manualActive;
        if (manualStillValid && cfg.manualAutoExpire && cfg.manualAppliedDate) {
          if (cfg.manualAppliedDate !== todayStr) {
            manualStillValid = false;
          }
        }

        var result = {
          code: 'OPEN',
          cssClass: 'st-open',
          enLabel: 'NOW OPEN',
          koTitle: '영업중',
          subText: '',
          isManual: false,
          isBlackout: false,
          todaySched: todaySched,
          kst: kst
        };

        if (manualStillValid) {
          result.isManual = true;
          var ms = String(cfg.manualStatus || '영업중').trim();
          if (ms === '영업중') {
            result.code = 'OPEN';
            result.cssClass = 'st-open';
            result.enLabel = 'NOW OPEN';
            result.koTitle = '영업중';
            result.subText = cfg.nextInfoEnabled ? ('오늘 ' + todaySched.closeStr + '까지 영업합니다') : '';
          } else if (ms === '주문마감') {
            result.code = 'LAST_ORDER';
            result.cssClass = 'st-lastorder';
            result.enLabel = 'LAST ORDER';
            result.koTitle = '주문 마감';
            result.subText = '오늘 주문이 마감되었습니다 (' + todaySched.closeStr + ' 종료)';
          } else if (ms === '브레이크타임') {
            result.code = 'BREAK';
            result.cssClass = 'st-break';
            result.enLabel = 'BREAK TIME';
            result.koTitle = '브레이크 타임';
            result.subText = '잠시 쉬어가는 시간입니다';
          } else if (ms === '재료소진') {
            result.code = 'SOLDOUT';
            result.cssClass = 'st-soldout';
            result.enLabel = 'SOLD OUT';
            result.koTitle = '재료 소진';
            result.subText = cfg.soldoutMsg || '준비된 재료가 모두 소진되었습니다';
          } else if (ms === '임시휴무') {
            result.code = 'HOLIDAY';
            result.cssClass = 'st-holiday';
            result.enLabel = 'TEMPORARY CLOSED';
            result.koTitle = '임시 휴무';
            result.subText = cfg.holidayMsg || '매장 사정으로 오늘 쉬어갑니다';
          } else {
            result.code = 'CLOSED';
            result.cssClass = 'st-closed';
            result.enLabel = 'CLOSED';
            result.koTitle = '영업 종료';
            result.subText = cfg.nextInfoEnabled ? findNextOpenText(1) : '방문해 주셔서 감사합니다';
          }
          return result;
        }

        // 2. 정기 휴무 요일 확인
        if (isTodayClosedDay) {
          result.code = 'HOLIDAY';
          result.cssClass = 'st-holiday';
          result.enLabel = 'REGULAR HOLIDAY';
          result.koTitle = '정기 휴무';
          result.subText = cfg.nextInfoEnabled ? ('오늘은 정기 휴무일입니다 · ' + findNextOpenText(1)) : '오늘은 정기 휴무일입니다';
          if (cfg.blackoutEnabled && (nowMin < 510 || nowMin >= 1230)) {
            result.isBlackout = true;
          }
          return result;
        }

        // 3. 영업시간표 자동 판별
        if (nowMin < todaySched.openMin) {
          result.code = 'PRE_OPEN';
          result.cssClass = 'st-preopen';
          result.enLabel = 'PREPARING';
          result.koTitle = '영업 준비중';
          result.subText = cfg.nextInfoEnabled ? ('오늘 ' + todaySched.openStr + '에 오픈합니다') : '';
          if (cfg.blackoutEnabled && nowMin < (todaySched.openMin - 30)) {
            result.isBlackout = true;
          }
        } else if (
          cfg.breakEnabled &&
          todaySched.bStartMin < todaySched.bEndMin &&
          nowMin >= todaySched.bStartMin &&
          nowMin < todaySched.bEndMin
        ) {
          result.code = 'BREAK';
          result.cssClass = 'st-break';
          result.enLabel = 'BREAK TIME';
          result.koTitle = '브레이크 타임';
          result.subText = cfg.nextInfoEnabled ? (todaySched.bEndStr + '에 다시 오픈합니다') : '잠시 쉬어가는 시간입니다';
        } else if (
          cfg.lastOrderEnabled &&
          todaySched.loMin > todaySched.openMin &&
          todaySched.loMin < todaySched.closeMin &&
          nowMin >= todaySched.loMin &&
          nowMin < todaySched.closeMin
        ) {
          result.code = 'LAST_ORDER';
          result.cssClass = 'st-lastorder';
          result.enLabel = 'LAST ORDER';
          result.koTitle = '주문 마감';
          result.subText = cfg.nextInfoEnabled ? ('오늘 ' + todaySched.closeStr + ' 영업 종료') : '오늘 주문이 마감되었습니다';
        } else if (nowMin >= todaySched.openMin && nowMin < todaySched.closeMin) {
          result.code = 'OPEN';
          result.cssClass = 'st-open';
          result.enLabel = 'NOW OPEN';
          result.koTitle = '영업중';
          result.subText = cfg.nextInfoEnabled ? ('오늘 ' + todaySched.closeStr + '까지 영업합니다') : '';
        } else {
          result.code = 'CLOSED';
          result.cssClass = 'st-closed';
          result.enLabel = 'CLOSED';
          result.koTitle = '영업 종료';
          result.subText = cfg.nextInfoEnabled ? findNextOpenText(1) : '방문해 주셔서 감사합니다';
          if (cfg.blackoutEnabled && nowMin >= (todaySched.closeMin + 30)) {
            result.isBlackout = true;
          }
        }

        return result;
      }

      /* ===== UI 렌더링 ===== */
      function applyRootFontSize() {
        var w = window.innerWidth || 1024;
        var h = window.innerHeight || 768;
        var minSide = Math.min(w, h);
        var scale = parseFloat(currentConfig.fontScale);
        if (isNaN(scale) || scale < 0.6 || scale > 2.0) scale = 1.0;

        var basePx = Math.max(12, Math.min(28, minSide * 0.025)) * scale;
        document.documentElement.style.fontSize = basePx.toFixed(2) + 'px';
      }

      function resolveThemeClass(cfg, state) {
        if (state.isBlackout) return 'theme-blackout';
        var mode = String(cfg.themeMode || '');
        if (mode.indexOf('상시 다크') !== -1) return 'theme-dark';
        if (mode.indexOf('상시 라이트') !== -1) return 'theme-light';

        var nowMin = state.kst.getUTCHours() * 60 + state.kst.getUTCMinutes();
        return (nowMin >= 450 && nowMin < 1050) ? 'theme-light' : 'theme-dark';
      }

      function resolveStatusAnimClass(cfg) {
        if (!cfg.animEnabled) return 'anim-status-none';
        var sa = String(cfg.statusAnimation || '');
        if (sa.indexOf('페이드') !== -1) return 'anim-status-fade';
        if (sa.indexOf('정적') !== -1) return 'anim-status-none';
        return 'anim-status-pulse';
      }

      function renderNotice(cfg) {
        var noticeBox = document.getElementById('noticeBox');
        var noticeEl = document.getElementById('noticeText');
        var noticeViewport = document.getElementById('noticeViewport');
        var rawText = String(cfg.noticeText || '').trim();

        if (!cfg.noticeEnabled || !rawText) {
          noticeBox.className = 'notice-box hidden';
          stopNoticeCarousel();
          lastNoticeSignature = '';
          return;
        }

        noticeBox.className = 'notice-box';

        var mode = 'ticker';
        if (cfg.animEnabled) {
          var na = String(cfg.noticeAnimation || '');
          if (na.indexOf('교차') !== -1) mode = 'fade';
          else if (na.indexOf('부유') !== -1) mode = 'float';
          else if (na.indexOf('정적') !== -1) mode = 'none';
        } else {
          mode = 'none';
        }

        var sig = mode + '|' + cfg.animEnabled + '|' + rawText;
        if (sig === lastNoticeSignature) return;
        lastNoticeSignature = sig;
        stopNoticeCarousel();

        var lines = [];
        var splitLines = rawText.split(/\r?\n/);
        for (var i = 0; i < splitLines.length; i++) {
          var trimmed = splitLines[i].trim();
          if (trimmed) lines.push(trimmed);
        }
        if (lines.length === 0) lines.push(rawText);

        noticeEl.style.webkitAnimationDuration = '';
        noticeEl.style.animationDuration = '';

        if (mode === 'ticker') {
          noticeEl.className = 'notice-text mode-ticker';
          noticeEl.textContent = lines.join('   ·   ');
          setTimeout(function () {
            var boxW = noticeViewport.offsetWidth || 600;
            var txtW = noticeEl.offsetWidth || 400;
            var sec = Math.max(12, Math.round((boxW + txtW) / 78));
            noticeEl.style.webkitAnimationDuration = sec + 's';
            noticeEl.style.animationDuration = sec + 's';
          }, 30);
        } else if (mode === 'fade') {
          noticeLines = lines;
          noticeLineIndex = 0;
          noticeEl.textContent = noticeLines[0];
          if (noticeLines.length > 1) {
            noticeEl.className = 'notice-text mode-fade';
            noticeFadeTimer = setInterval(function () {
              noticeEl.className = 'notice-text mode-fade is-fading-out';
              setTimeout(function () {
                noticeLineIndex = (noticeLineIndex + 1) % noticeLines.length;
                noticeEl.textContent = noticeLines[noticeLineIndex];
                noticeEl.className = 'notice-text mode-fade';
              }, 380);
            }, 5000);
          } else {
            noticeEl.className = 'notice-text mode-fade mode-fade-single';
          }
        } else if (mode === 'float') {
          noticeEl.className = 'notice-text mode-float';
          noticeEl.textContent = lines.join('\n');
        } else {
          noticeEl.className = 'notice-text mode-none';
          noticeEl.textContent = lines.join('\n');
        }
      }

      function stopNoticeCarousel() {
        if (noticeFadeTimer) {
          clearInterval(noticeFadeTimer);
          noticeFadeTimer = null;
        }
      }

      function renderQr(cfg) {
        var qrBox = document.getElementById('qrBox');
        var qrImg = document.getElementById('qrImg');
        var qrCap = document.getElementById('qrCaption');
        var url = String(cfg.qrUrl || '').trim();

        if (!cfg.qrEnabled || !url) {
          qrBox.className = 'qr-box hidden';
          return;
        }

        qrCap.textContent = cfg.qrLabel || '매장 소식 보기';
        if (url !== lastQrUrl) {
          lastQrUrl = url;
          qrImg.onerror = function () {
            qrBox.className = 'qr-box hidden';
          };
          qrImg.onload = function () {
            if (currentConfig.qrEnabled && String(currentConfig.qrUrl || '').trim()) {
              qrBox.className = 'qr-box';
            }
          };
          qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=' + encodeURIComponent(url);
        } else {
          qrBox.className = 'qr-box';
        }
      }

      function renderAll() {
        applyRootFontSize();
        var utcMs = getNowUtcMs();
        var state = evaluateDisplayState(currentConfig, utcMs);
        var kst = state.kst;

        // 1. Body 클래스(테마 + 상태 + 애니메이션)
        var themeCls = resolveThemeClass(currentConfig, state);
        var animFlagCls = currentConfig.animEnabled ? 'anim-on' : 'anim-off';
        var statusAnimCls = resolveStatusAnimClass(currentConfig);
        document.body.className = themeCls + ' ' + state.cssClass + ' ' + animFlagCls + ' ' + statusAnimCls;

        // 2. 픽셀 시프트 & 전체화면/API연결 버튼 상태
        var shiftLayer = document.getElementById('shiftLayer');
        shiftLayer.className = currentConfig.pixelShiftEnabled ? 'shift-layer pixel-shift-on' : 'shift-layer';
        updateFullscreenButton();

        var apiSetupBtn = document.getElementById('apiSetupBtn');
        apiSetupBtn.className = gasApiUrl ? 'hdr-btn hidden' : 'hdr-btn warn-btn';

        // 3. 상단 브랜드
        document.getElementById('brandName').textContent = currentConfig.storeName || '견과다방';
        var subEl = document.getElementById('brandSub');
        var subTxt = String(currentConfig.storeSubtitle || '').trim();
        subEl.textContent = subTxt;
        subEl.className = subTxt ? 'brand-sub' : 'brand-sub hidden';

        // 4. 영업 상태 카드 내 날짜 & 시계
        var metaRow = document.getElementById('statusMetaRow');
        var clockBox = document.getElementById('clockBox');
        if (currentConfig.clockEnabled) {
          clockBox.className = 'clock-inline';
          metaRow.className = 'status-meta-row';
          document.getElementById('clockHour').textContent = pad2(kst.getUTCHours());
          document.getElementById('clockMin').textContent = pad2(kst.getUTCMinutes());
          document.getElementById('clockDate').textContent =
            (kst.getUTCMonth() + 1) + '월 ' + kst.getUTCDate() + '일 (' + DAY_NAMES[kst.getUTCDay()] + ')';
        } else {
          clockBox.className = 'clock-inline hidden';
          metaRow.className = 'status-meta-row center-only';
        }

        var syncDot = document.getElementById('syncDot');
        var isFresh = lastSyncSuccessMs > 0 && (Date.now() - lastSyncSuccessMs) < 90000;
        syncDot.className = isFresh ? 'sync-dot' : 'sync-dot offline';

        // 5. 대형 상태 문구 (5자 이상일 때 1줄 유지를 위한 status-main-long 적용)
        document.getElementById('statusEn').textContent = state.enLabel;
        var mainEl = document.getElementById('statusMain');
        mainEl.textContent = state.koTitle;
        var compactTitle = String(state.koTitle || '').replace(/\s+/g, '');
        var baseMainCls = compactTitle.length >= 5 ? 'status-main status-main-long' : 'status-main';

        if (lastRenderedStatusCode && lastRenderedStatusCode !== state.code) {
          if (statusEnterTimer) clearTimeout(statusEnterTimer);
          mainEl.className = baseMainCls + ' status-entering';
          statusEnterTimer = setTimeout(function () {
            mainEl.className = baseMainCls;
          }, 600);
        } else if (mainEl.className.indexOf('status-entering') === -1) {
          mainEl.className = baseMainCls;
        }
        lastRenderedStatusCode = state.code;

        var stSubEl = document.getElementById('statusSub');
        stSubEl.textContent = state.subText;
        stSubEl.className = state.subText ? 'status-sub' : 'status-sub hidden';

        // 영업시간 요약 바
        var stripParts = [
          '평일 ' + currentConfig.weekdayOpen + ' - ' + currentConfig.weekdayClose,
          '주말 ' + currentConfig.weekendOpen + ' - ' + currentConfig.weekendClose
        ];
        if (currentConfig.breakEnabled) {
          var bText = state.todaySched.isWeekend
            ? (currentConfig.weekendBreakStart + '~' + currentConfig.weekendBreakEnd)
            : (currentConfig.weekdayBreakStart + '~' + currentConfig.weekdayBreakEnd);
          stripParts.push('브레이크 ' + bText);
        }
        if (currentConfig.lastOrderEnabled) {
          var loText = state.todaySched.isWeekend ? currentConfig.weekendLastOrder : currentConfig.weekdayLastOrder;
          stripParts.push('라스트오더 ' + loText);
        }
        var closedStr = String(currentConfig.closedDays || '').trim();
        if (closedStr && closedStr !== '없음') {
          stripParts.push('휴무 ' + closedStr);
        }
        document.getElementById('hoursStrip').innerHTML = stripParts.join('<span class="hours-sep">|</span>');

        // 6. 하단 공지 & QR
        renderNotice(currentConfig);
        renderQr(currentConfig);

        var bottomBar = document.getElementById('bottomBar');
        var noticeHidden = document.getElementById('noticeBox').className.indexOf('hidden') !== -1;
        var qrHidden = document.getElementById('qrBox').className.indexOf('hidden') !== -1;
        bottomBar.className = (noticeHidden && qrHidden) ? 'bottom-bar hidden' : 'bottom-bar';

        // 7. 하루 1회 새벽 안전 리로드 (04:05 KST, 온라인 & 최근 동기화 정상 시에만)
        if (
          !reloadAttempted &&
          (Date.now() - pageBootMs) > 3600000 &&
          kst.getUTCHours() === 4 &&
          kst.getUTCMinutes() === 5 &&
          (typeof navigator.onLine === 'undefined' || navigator.onLine) &&
          isFresh
        ) {
          reloadAttempted = true;
          window.location.reload();
        }
      }

      /* ===== 서버 동기화 (XHR + JSONP 이중 폴백) ===== */
      function buildApiUrl(baseUrl, extraParams) {
        var sep = (baseUrl.indexOf('?') === -1) ? '?' : '&';
        return baseUrl + sep + 'api=status&t=' + Date.now() + (extraParams || '');
      }

      function applyServerPayload(data) {
        if (!data || typeof data !== 'object') return;
        currentConfig = mergeConfig(data);
        lastSyncSuccessMs = Date.now();
        saveLocalValue(STORAGE_KEY, JSON.stringify(currentConfig));
        renderAll();
      }

      function fetchViaJsonp(baseUrl) {
        if (!baseUrl) return;
        var cbName = 'gwJsonp_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
        var scriptEl = document.createElement('script');
        var finished = false;

        function cleanup() {
          if (finished) return;
          finished = true;
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
          if (scriptEl && scriptEl.parentNode) {
            scriptEl.parentNode.removeChild(scriptEl);
          }
        }

        window[cbName] = function (data) {
          cleanup();
          applyServerPayload(data);
        };

        var timeoutTimer = setTimeout(function () {
          cleanup();
          renderAll();
        }, 7000);

        scriptEl.onerror = function () {
          clearTimeout(timeoutTimer);
          cleanup();
          renderAll();
        };

        scriptEl.src = buildApiUrl(baseUrl, '&callback=' + encodeURIComponent(cbName));
        (document.head || document.body || document.documentElement).appendChild(scriptEl);
      }

      function pollConfig() {
        if (!gasApiUrl) return;
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', buildApiUrl(gasApiUrl, ''), true);
          xhr.timeout = 7000;
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status >= 200 && xhr.status < 300) {
                try {
                  var parsed = JSON.parse(xhr.responseText);
                  applyServerPayload(parsed);
                  return;
                } catch (e) {}
              }
              fetchViaJsonp(gasApiUrl);
            }
          };
          xhr.ontimeout = function () {
            fetchViaJsonp(gasApiUrl);
          };
          xhr.onerror = function () {
            fetchViaJsonp(gasApiUrl);
          };
          xhr.send();
        } catch (e) {
          fetchViaJsonp(gasApiUrl);
        }
      }

      function scheduleNextPoll() {
        if (pollTimer) clearTimeout(pollTimer);
        var kst = getKstDate(getNowUtcMs());
        var h = kst.getUTCHours();
        // 주간(07:00~22:00) 15초, 심야 60초 적응형 폴링
        var delay = (h >= 7 && h < 22) ? 15000 : 60000;
        pollTimer = setTimeout(function () {
          pollConfig();
          scheduleNextPoll();
        }, delay);
      }

      /* ===== API 설정 모달 ===== */
      function openApiModal() {
        var modal = document.getElementById('apiModal');
        var input = document.getElementById('apiUrlInput');
        input.value = gasApiUrl || '';
        modal.className = 'modal-backdrop';
      }

      function closeApiModal() {
        document.getElementById('apiModal').className = 'modal-backdrop hidden';
      }

      function saveApiUrlFromModal() {
        var val = String(document.getElementById('apiUrlInput').value || '').trim();
        if (val && val.indexOf('http') !== 0) {
          showToast('올바른 https:// 웹 앱 URL을 입력해 주세요.', 3500);
          return;
        }
        gasApiUrl = val;
        saveLocalValue(API_URL_STORAGE_KEY, gasApiUrl);
        closeApiModal();
        renderAll();
        if (gasApiUrl) {
          pollConfig();
          showToast('구글 시트 API와 연결을 시도합니다.', 3000);
        }
      }

      /* ===== 초기화 ===== */
      function init() {
        // 1. API URL 우선순위: ?api= 쿼리 > 코드 상수 > localStorage
        var qApi = String(getQueryParam('api') || '').trim();
        if (qApi && qApi.indexOf('http') === 0) {
          gasApiUrl = qApi;
          saveLocalValue(API_URL_STORAGE_KEY, gasApiUrl);
        } else if (DEFAULT_GAS_API_URL && DEFAULT_GAS_API_URL.indexOf('http') === 0) {
          gasApiUrl = DEFAULT_GAS_API_URL;
        } else {
          var savedUrl = loadLocalValue(API_URL_STORAGE_KEY);
          if (savedUrl && savedUrl.indexOf('http') === 0) {
            gasApiUrl = savedUrl;
          }
        }

        // 2. 마지막 정상 캐시 복원
        try {
          var cachedRaw = loadLocalValue(STORAGE_KEY);
          if (cachedRaw) {
            currentConfig = mergeConfig(JSON.parse(cachedRaw));
          }
        } catch (e) {}

        // 3. UI 이벤트 바인딩
        document.getElementById('fsBtn').onclick = toggleFullscreen;
        document.getElementById('apiSetupBtn').onclick = openApiModal;
        document.getElementById('apiCancelBtn').onclick = closeApiModal;
        document.getElementById('apiSaveBtn').onclick = saveApiUrlFromModal;

        // 브랜드 영역 더블클릭 시 언제든 API URL 수정 가능
        var lastBrandTap = 0;
        document.getElementById('brandBox').onclick = function () {
          var now = Date.now();
          if (now - lastBrandTap < 450) {
            openApiModal();
            lastBrandTap = 0;
          } else {
            lastBrandTap = now;
          }
        };

        // 중앙 화면 더블탭으로 전체화면 토글
        document.getElementById('heroWrap').onclick = function () {
          var now = Date.now();
          if (now - lastHeroTapMs < 400) {
            toggleFullscreen();
            lastHeroTapMs = 0;
          } else {
            lastHeroTapMs = now;
          }
        };

        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        renderAll();

        // 1초마다 시계/상태 재평가
        setInterval(function () {
          renderAll();
        }, 1000);

        window.onresize = function () {
          applyRootFontSize();
        };

        // 즉시 1회 동기화 후 주기 폴링 시작
        if (gasApiUrl) {
          pollConfig();
        } else {
          showToast('상단 [시트 연결] 버튼을 눌러 구글 Apps Script 웹 앱 URL을 연결하세요.', 5000);
        }
        scheduleNextPoll();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
